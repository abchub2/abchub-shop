<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이팜 (Lee's Farm) - 산지직송 제철 과일</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-[#FBF9F4] text-stone-800">

    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-50 bg-[#FBF9F4]/90 backdrop-blur-md border-b border-amber-900/10">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="text-xl font-bold text-amber-900 flex items-center gap-2">
                <span>🌱</span> 이팜 <span class="text-xs font-normal text-amber-800/60">Lee's Farm</span>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-stone-700">
                <a href="#hero" class="hover:text-emerald-700 transition">홈</a>
                <a href="#calendar" class="hover:text-emerald-700 transition">제철 달력</a>
                <a href="#products" class="hover:text-emerald-700 transition">상품 목록</a>
                <a href="#about" class="hover:text-emerald-700 transition">농장 소개</a>
            </nav>
            <div class="flex items-center gap-2 sm:gap-3">
                <button type="button" id="btn-admin-open" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-800 px-3 py-2 rounded-xl font-bold transition flex items-center gap-1 cursor-pointer">
                    <span>⚙️</span> 상품 관리자
                </button>
                <button type="button" id="btn-cart-toggle" class="relative bg-emerald-800 text-white px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-emerald-900 transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                    🛒 장바구니 <span id="cart-badge" class="bg-amber-400 text-stone-900 text-xs px-1.5 py-0.2 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 히어로 배너 -->
    <section id="hero" class="relative bg-[#2D4030] text-amber-50 py-20 px-4 overflow-hidden">
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <span class="bg-emerald-900/80 text-amber-200 text-xs px-3.5 py-1.5 rounded-full font-medium inline-block mb-4 border border-amber-200/20">
                www.abchub.kr • 산지직송 프리미엄 과일
            </span>
            <h1 class="text-3xl md:text-5xl font-bold tracking-tight mb-6 leading-tight font-serif text-amber-100">
                자연의 정성을 담은<br>신선한 제철 과일을 전합니다
            </h1>
            <p class="text-stone-300 text-base md:text-lg mb-8 max-w-2xl mx-auto font-light">
                복잡한 유통 과정 없이 산지에서 수확하여 집 앞까지 정성껏 보내드립니다.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <a href="#products" class="bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold px-8 py-3.5 rounded-xl transition shadow-md">
                    제철 과일 구경하기
                </a>
                <a href="http://pf.kakao.com/_cxhCVn/chat" target="_blank" class="bg-white/10 hover:bg-white/20 text-white font-medium px-8 py-3.5 rounded-xl transition border border-white/20">
                    카카오톡 문의하기
                </a>
            </div>
        </div>
    </section>

    <!-- 12월 제철 과일 달력 -->
    <section id="calendar" class="py-12 bg-white border-b border-amber-900/5">
        <div class="max-w-6xl mx-auto px-4">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-stone-900">1년 12달 제철 달력</h2>
                <p class="text-stone-500 text-sm mt-1">월을 클릭하면 해당 시즌의 대표 과일을 모아볼 수 있습니다.</p>
            </div>
            <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 gap-2" id="month-buttons">
                <!-- JS 생성 -->
            </div>
        </div>
    </section>

    <!-- 과일 상품 목록 -->
    <section id="products" class="py-16 px-
